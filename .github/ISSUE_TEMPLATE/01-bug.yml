name: Bug report
description: Report a defect in Corvin software or docs.
title: "[bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Security vulnerabilities must follow SECURITY.md, not this form.
  - type: dropdown
    id: repository
    attributes:
      label: Repository
      description: Which repository is affected?
      options:
        - web
        - server
        - chess-core
        - engine
        - engine-train
        - worker
        - fairplay
        - puzzles
        - explorer
        - broadcast
        - design-system
        - assets
        - mobile
        - sdk
        - bots
        - translations
        - infra
        - website
        - .github
        - unsure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the defect.
      placeholder: Steps, expected result, actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser or runtime, commit hash if known.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: This is not a security vulnerability report
          required: true
